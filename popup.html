<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h3 class="begin-title"> Вставьте ваши ссылки </h3>
  <textarea id="linksInput" class="textarea" placeholder="example.com&#10;google.com"></textarea>
  <button id="saveBtn" class="save-btn">Сохранить список</button>
  
  <!-- Новый блок для работы с файлами TXT и JSON -->
  <div class="file-actions">
    <div class="export-buttons">
      <button id="exportTxtBtn" class="file-btn">Экспорт в TXT</button>
      <button id="exportJsonBtn" class="file-btn">Экспорт в JSON</button>
    </div>
    
    <div class="import-zone">
      <label for="importFile" class="import-label">Импорт из TXT / JSON:</label>
      <input type="file" id="importFile" class="import-input" accept=".txt,.json">
    </div>
  </div>
  
  <ul id="linksList" class="link-list"></ul>
  
  <button id="openAllBtn" class="open-all-btn">ОТКРЫТЬ ВСЕ ССЫЛКИ СРАЗУ</button>

  <button id="githubBUTTON"class="github-button">Ссылка на Github</button>

  <script src="popup.js"></script>
</body>
</html>
